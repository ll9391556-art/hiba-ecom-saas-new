<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OrderFlow — إدارة عملاء Fiverr</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png"/>
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/tokens.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;padding:24px 16px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:26px;margin-bottom:4px;display:flex;align-items:center;gap:12px}
p.sub{color:var(--muted);font-size:15px;margin-bottom:20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:22px;margin-bottom:20px}
.card h2{font-size:18px;margin-bottom:14px;color:var(--ink)}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:5px;margin-top:12px}
input,select{width:100%;min-height:var(--h-field);background:var(--white);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-field);padding:10px 14px;font-family:inherit;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus-ring)}
button{background:var(--brand);color:#fff;border:none;border-radius:var(--r-btn);min-height:var(--h-btn);padding:0 20px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px}
button:hover{background:var(--brand-dark)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-volt{background:var(--volt);color:var(--ink)}
.btn-volt:hover{background:#C6F21F}
.sep{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sep-title{font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:700}
.msg{margin-top:14px;padding:12px 14px;border-radius:var(--r-field);font-size:15px;display:none}
.msg.ok{background:var(--st-delivered-bg);border:1px solid var(--volt);color:var(--st-delivered-fg);display:block}
.msg.err{background:var(--st-refused-bg);border:1px solid #FFB8AD;color:var(--st-refused-fg);display:block}
.result-box{background:var(--bg);border-radius:16px;padding:14px;margin-top:10px;font-size:15px;line-height:1.8}
.result-box code{color:var(--brand-dark);word-break:break-all}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th{text-align:right;color:var(--muted);font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--soft)}
td.uid{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700}
.b-free{background:var(--st-neutral-bg);color:var(--st-neutral-fg)}.b-starter{background:var(--brand-light);color:var(--brand-dark)}
.b-pro{background:var(--brand);color:#fff}.b-full{background:var(--volt-light);color:var(--st-delivered-fg)}
.b-business{background:var(--white);color:var(--brand-dark);box-shadow:inset 0 0 0 1.5px var(--brand)}.b-early{background:var(--volt);color:var(--ink)}.b-lifetime{background:var(--volt-light);color:var(--st-delivered-fg)}
.copy-btn{background:var(--white);border:1px solid var(--line);color:var(--brand-dark);min-height:40px;padding:0 12px;border-radius:var(--r-btn);font-size:14px;cursor:pointer;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="/static/img/logo.svg" alt="" width="40" height="40"/> إدارة عملاء Fiverr</h1>
  <p class="sub">صفحة خاصة بك فقط — إنشاء حسابات جديدة وتغيير الخطط لعملاء OrderFlow</p>

  <div class="card">
    <h2>مفتاح الإدارة</h2>
    <input id="adminKey" type="password" placeholder="ADMIN_API_KEY"/>
  </div>

  <div class="card">
    <h2>➕ إنشاء عميل جديد</h2>
    <label>اسم المستخدم (للدخول)</label>
    <input id="newUsername"/>
    <label>كلمة السر</label>
    <input id="newPassword" type="text"/>
    <label>اسم المتجر</label>
    <input id="newStoreName" placeholder="مثلاً: متجر سارة"/>

    <div class="sep">
      <div class="sep-title">⚡ قوالب سريعة — عملاء Fiverr (لا تظهر لهم صفحة الأسعار المحلية)</div>
      <button onclick="createClient('starter','fiverr')">Fiverr Basic — $35</button>
      <button class="btn-volt" onclick="createClient('pro','fiverr')" style="margin-right:8px">Fiverr Premium — $85</button>
    </div>

    <div class="sep">
      <div class="sep-title">💼 عميل محلي (يشوف صفحة الأسعار كاملة)</div>
      <select id="newPlanLocal">
        <option value="free">Free</option>
        <option value="starter" selected>Starter</option>
        <option value="pro">Pro</option>
        <option value="business">Business</option>
        <option value="early">أوائل التجار (Early) — <span id="earlySlotsDisplay">...</span> متبقي</option>
      </select>
      <select id="newDurationLocal"><option value="month">شهر</option><option value="year">عام</option><option value="none">بلا انتهاء</option></select>
      <button onclick="createClient(document.getElementById('newPlanLocal').value,'local',document.getElementById('newDurationLocal').value)">إنشاء حساب محلي</button>
    </div>

    <div id="createMsg" class="msg"></div>
    <div id="createResult"></div>
  </div>

  <div class="card">
    <h2>📋 العملاء الحاليون</h2>
    <button onclick="loadClients()" style="margin-top:0">🔄 تحديث القائمة</button>
    <div id="clientsBox"></div>
  </div>
</div>

<script>
// دالة escape إجبارية لكل قيمة نصية قادمة من السيرفر قبل إدراجها بـ innerHTML —
// قبل التعديل كانت القيم تُدرج خام (c.username, c.userId...) مما يفتح XSS مخزّن
// لو احتوى أي اسم مستخدم وسوم HTML/سكربت.
function esc(s){
  return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function adminKey(){ return document.getElementById("adminKey").value.trim(); }
function showMsg(id, text, type){
  var el = document.getElementById(id);
  el.className = "msg " + type;
  el.textContent = text;
}

async function createClient(plan, source, duration){
  var key = adminKey();
  if(!key){ showMsg("createMsg","أدخل مفتاح الإدارة أولاً","err"); return; }
  var username = document.getElementById("newUsername").value.trim();
  var password = document.getElementById("newPassword").value.trim();
  var storeName = document.getElementById("newStoreName").value.trim();
  if(!username || !password){ showMsg("createMsg","أدخل اسم المستخدم وكلمة السر","err"); return; }
  try{
    var r = await fetch("/api/admin/createClient", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Admin-Key":key},
      body: JSON.stringify({username:username, password:password, storeName:storeName, plan:plan, source:source, duration:duration||"none"})
    });
    var data = await r.json();
    if(data.status==="ok"){
      showMsg("createMsg","✅ تم إنشاء الحساب بنجاح ("+esc(plan)+" / "+esc(source)+")","ok");
      document.getElementById("createResult").innerHTML =
        '<div class="result-box">'+
          '<div>👤 اسم المستخدم: <code>'+esc(username)+'</code></div>'+
          '<div>🔑 كلمة السر: <code>'+esc(password)+'</code></div>'+
          '<div>🔗 رابط المتجر: <code id="lk">'+esc(data.data.storeLink)+'</code></div>'+
          '<button class="copy-btn" data-copy="'+esc(username+' / '+password)+'">نسخ بيانات الدخول</button>'+
          '<button class="copy-btn" data-copy="'+esc(data.data.storeLink)+'">نسخ رابط المتجر</button>'+
        '</div>';
      document.querySelectorAll('.copy-btn').forEach(function(btn){
        btn.addEventListener('click', function(){ copyText(btn.getAttribute('data-copy')); });
      });
      document.getElementById("newUsername").value = "";
      document.getElementById("newPassword").value = "";
      document.getElementById("newStoreName").value = "";
      loadClients();
    } else {
      showMsg("createMsg","❌ "+data.message,"err");
    }
  }catch(e){ showMsg("createMsg","خطأ فالاتصال بالسيرفر","err"); }
}

function copyText(t){
  navigator.clipboard.writeText(t);
}

async function loadClients(){
  var key = adminKey();
  if(!key){ showMsg("createMsg","أدخل مفتاح الإدارة أولاً","err"); return; }
  var box = document.getElementById("clientsBox");
  box.innerHTML = "⏳ تحميل...";
  try{
    var r = await fetch("/api/admin/listClients", { headers:{"X-Admin-Key":key} });
    var data = await r.json();
    if(data.status!=="ok"){ box.innerHTML = "❌ "+esc(data.message); return; }

    var earlyUsed = data.data.filter(function(c){ return c.plan==="early"; }).length;
    var earlyLeftEl = document.getElementById("earlySlotsDisplay");
    if(earlyLeftEl) earlyLeftEl.textContent = Math.max(0, 50-earlyUsed);

    if(!data.data.length){ box.innerHTML = "لا يوجد عملاء بعد"; return; }
    var allowedPlans = ["free","starter","pro","business","early","full","lifetime"];
    box.innerHTML = '<div class="table-scroll"><table><thead><tr><th>المستخدم</th><th>ID</th><th>المصدر</th><th>الخطة</th><th>ينتهي</th><th>تغيير الخطة (بعد الدفع)</th></tr></thead><tbody>'+
      data.data.map(function(c){
        var srcBadge = c.source==="fiverr" ? '<span class="badge b-pro">Fiverr</span>' : '<span class="badge b-starter">محلي</span>';
        var safePlan = allowedPlans.indexOf(c.plan) !== -1 ? c.plan : "free";
        return '<tr><td>'+esc(c.username)+'</td><td class="uid">'+esc(c.userId)+'</td>'+
          '<td>'+srcBadge+'</td>'+
          '<td><span class="badge b-'+safePlan+'">'+esc(String(c.plan).toUpperCase())+'</span></td>'+
          '<td style="font-size:13px">'+expiryCell(c)+'</td>'+
          '<td><select class="plan-select">'+
            allowedPlans.map(function(p){
              return '<option value="'+p+'"'+(p===safePlan?" selected":"")+'>'+p+'</option>';
            }).join("")+
          '</select> <select class="duration-select"><option value="month">شهر</option><option value="year">عام</option><option value="none">بلا انتهاء</option></select> '+
          '<button class="plan-save" data-uid="'+esc(c.userId)+'" data-uname="'+esc(c.username)+'" style="margin-top:0;min-height:40px;padding:0 14px">تفعيل</button></td></tr>';
      }).join("")+
      '</tbody></table></div>';
    document.querySelectorAll('.plan-save').forEach(function(btn){
      btn.addEventListener('click', function(){
        var row = btn.closest('tr');
        changePlan(btn.getAttribute('data-uid'), btn.getAttribute('data-uname'),
                   row.querySelector('.plan-select').value, row.querySelector('.duration-select').value);
      });
    });
  }catch(e){ box.innerHTML = "خطأ فالاتصال"; }
}

function expiryCell(c){
  if(!c.planExpiresAt) return '—';
  var d = new Date(c.planExpiresAt).toLocaleDateString();
  var states = {active:'', expiring:' ⚠️', grace:' ⏳ سماح', expired:' ❌ انتهى'};
  return esc(d + (states[c.planState]||''));
}

async function changePlan(userId, username, plan, duration){
  var key = adminKey();
  try{
    var r = await fetch("/api/updateUserPlan", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Admin-Key":key},
      body: JSON.stringify({userId:userId, username:username, plan:plan, duration:duration})
    });
    var data = await r.json();
    if(data.status==="ok") loadClients();
    else alert("❌ "+data.message);
  }catch(e){ alert("خطأ فالاتصال"); }
}
</script>
</body>
</html>
