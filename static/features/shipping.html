<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ربط شركات الشحن — OrderFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/tokens.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px}
.field{margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
border-radius:8px;padding:9px 12px;font-size:13px}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 22px;
font-size:13px;font-weight:700;cursor:pointer}
.btn-danger{background:var(--st-refused-bg);color:var(--st-refused-fg);border:1px solid var(--st-refused-bg);margin-right:8px}
.msg{margin-top:12px;font-size:12px;display:none}
.msg.ok{color:var(--green);display:block}
.msg.err{color:var(--red);display:block}
.status-box{background:var(--volt-light);border:1px solid var(--volt);border-radius:10px;padding:14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚚 ربط شركات الشحن</h1>

  <div id="connectedBox" style="display:none" class="status-box">
    <div style="color:var(--green);font-weight:700">✅ متصل بـ Yalidine</div>
    <div id="connectedSince" style="font-size:12px;color:var(--muted);margin-top:4px"></div>
    <button class="btn-danger" style="margin-top:10px" data-on-click="disconnect()">فك الربط</button>
  </div>

  <div id="soonCard" class="card" style="text-align:center">
    <div style="font-size:34px;margin-bottom:8px">🚧</div>
    <div style="font-weight:700;margin-bottom:6px">قريبًا</div>
    <p style="font-size:12px;color:var(--muted)">ربط Yalidine وشركات الشحن الأخرى مازال ما تفعّلش. غادي نعلموك كي يكون جاهز.</p>
  </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/api.js"></script>
<script>
registerActions({
  "disconnect()": function(event){ disconnect(); },
});
// API_URL / authToken / apiGet / apiPost / esc: من /static/js/core.js و api.js (Phase 4 / F4)

async function loadStatus(){
  var r = await apiGet("/shipping/status");
  if(r.status==="ok" && r.data.connected){
    document.getElementById("connectedBox").style.display = "block";
    document.getElementById("connectedSince").textContent = "منذ: "+r.data.connectedAt;
  }
}

async function disconnect(){
  if(!confirm("فك ربط Yalidine؟")) return;
  await apiPost("/shipping/disconnect", {});
  location.reload();
}

loadStatus();
</script>
</body>
</html>
