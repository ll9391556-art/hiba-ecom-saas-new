<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>المساعد الإداري — OrderFlow</title>
<link rel="stylesheet" href="/static/css/tokens.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;padding:20px;display:flex;flex-direction:column;height:100vh}
.wrap{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1;min-height:0}
h1{font-size:20px;margin-bottom:12px;flex-shrink:0}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
margin-bottom:12px;font-size:12px;color:var(--muted);white-space:pre-line;flex-shrink:0;max-height:140px;overflow-y:auto;
box-shadow:var(--shadow)}
.chat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;
display:flex;flex-direction:column;overflow:hidden;min-height:0;box-shadow:var(--shadow)}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble-wrap{display:flex}
.bubble-wrap.user{justify-content:flex-end}
.bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.7;white-space:pre-line}
.user .bubble{background:var(--accent);color:#fff;border-bottom-left-radius:4px}
.assistant .bubble{background:var(--card2);color:var(--text);border-bottom-right-radius:4px}
.input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
textarea{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);
border-radius:10px;padding:10px 12px;font-size:13px;resize:none;min-height:42px;font-family:inherit}
button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 18px;
font-size:13px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:13px}
.suggestions{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sugg-chip{background:var(--card2);border:1px solid var(--border);color:var(--muted);
padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer}
.sugg-chip:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 المساعد الإداري الذكي</h1>
  <div id="summaryCard" class="summary-card">⏳ جاري تحميل ملخص المتجر...</div>

  <div class="chat-box">
    <div class="suggestions">
      <span class="sugg-chip" data-on-click="askSuggested('كيف أزيد معدل تأكيد الطلبات؟')">كيف أزيد معدل التأكيد؟</span>
      <span class="sugg-chip" data-on-click="askSuggested('شو المنتجات يلي لازم أعيد تخزينها؟')">مخزون منخفض</span>
      <span class="sugg-chip" data-on-click="askSuggested('لخصلي أداء الفريق هالفترة')">أداء الفريق</span>
    </div>
    <div id="messages" class="messages">
      <div class="empty">اسأليني عن أي شي متعلق بمتجرك — مبيعات، مخزون، أداء الفريق، اقتراحات لتحسين العمل</div>
    </div>
    <div class="input-row">
      <textarea id="msgInput" placeholder="اكتبي سؤالك هنا..." data-on-keydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="sendBtn" data-on-click="sendMessage()">إرسال</button>
    </div>
  </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/api.js"></script>
<script>
registerActions({
  "askSuggested('شو المنتجات يلي لازم أعيد تخزينها؟')": function(event){ askSuggested('شو المنتجات يلي لازم أعيد تخزينها؟'); },
  "askSuggested('كيف أزيد معدل تأكيد الطلبات؟')": function(event){ askSuggested('كيف أزيد معدل تأكيد الطلبات؟'); },
  "askSuggested('لخصلي أداء الفريق هالفترة')": function(event){ askSuggested('لخصلي أداء الفريق هالفترة'); },
  "if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}": function(event){ if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}; },
  "sendMessage()": function(event){ sendMessage(); },
});
// API_URL / authToken / apiGet / apiPost / esc: من /static/js/core.js و api.js (Phase 4 / F4)

function addBubble(role, text){
  var box = document.getElementById("messages");
  var empty = box.querySelector(".empty");
  if(empty) empty.remove();
  var wrap = document.createElement("div");
  wrap.className = "bubble-wrap "+role;
  var b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  wrap.appendChild(b);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
  return b;
}

async function loadSummary(){
  var r = await apiGet("/assistant/weeklyReport");
  var box = document.getElementById("summaryCard");
  if(r.status==="ok") box.textContent = r.data.summary;
  else box.textContent = "❌ "+r.message;
}

async function loadHistory(){
  var r = await apiGet("/assistant/history");
  if(r.status==="ok" && r.data.length){
    document.getElementById("messages").innerHTML = "";
    r.data.forEach(function(h){ addBubble(h.role==="user"?"user":"assistant", h.content); });
  }
}

function askSuggested(text){
  document.getElementById("msgInput").value = text;
  sendMessage();
}

async function sendMessage(){
  var input = document.getElementById("msgInput");
  var text = input.value.trim();
  if(!text) return;
  var btn = document.getElementById("sendBtn");
  addBubble("user", text);
  input.value = "";
  btn.disabled = true;
  var thinking = addBubble("assistant", "⏳ جاري التفكير...");
  try{
    var r = await apiPost("/assistant/ask", {message:text});
    if(r.status==="ok") thinking.textContent = r.data.reply;
    else thinking.textContent = "❌ "+r.message;
  }catch(e){ thinking.textContent = "❌ خطأ فالاتصال"; }
  finally{ btn.disabled = false; }
}

loadSummary();
loadHistory();
</script>
</body>
</html>
