<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>أدوات التتبع الإعلاني — OrderFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/tokens.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);font-family:var(--font);padding:24px;min-height:100vh}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:21px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;
  margin-bottom:18px;box-shadow:var(--shadow)}
.field{margin-bottom:16px}
label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);margin-bottom:18px;line-height:1.7;
  background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:9px 12px;font-size:13px;transition:.15s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;
  padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;
  box-shadow:0 6px 16px -6px rgba(59,43,255,.35);transition:.15s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(59,43,255,.45)}
.msg{margin-top:12px;font-size:12px;display:none;font-weight:600}
.msg.ok{color:var(--green);display:block}
.msg.err{color:var(--red);display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 أدوات التتبع الإعلاني</h1>
  <div class="card">
    <p class="hint">أدخلي معرّفات البكسل تبعك، وراح تنحقن تلقائياً بصفحة متجرك العامة
    (بلا حاجة تلمسي أي كود). الأحداث الأساسية (زيارة الصفحة، إضافة للسلة، بدء الدفع، الشراء) بتنتبّع أوتوماتيكياً.</p>

    <div class="field">
      <label>📘 Meta Pixel ID (فيسبوك/إنستغرام)</label>
      <input id="t_meta" placeholder="مثال: 123456789012345"/>
    </div>
    <div class="field">
      <label>🎵 TikTok Pixel ID</label>
      <input id="t_tiktok" placeholder="مثال: CXXXXXXXXXXXXXXXXXXX"/>
    </div>
    <div class="field">
      <label>🔍 Google Ads Conversion ID</label>
      <input id="t_gads" placeholder="مثال: AW-1234567890"/>
    </div>
    <div class="field">
      <label>📊 Google Analytics (GA4) ID</label>
      <input id="t_ga4" placeholder="مثال: G-XXXXXXXXXX"/>
    </div>
    <div class="field">
      <label>👻 Snapchat Pixel ID</label>
      <input id="t_snap" placeholder="مثال: xxxxxxxx-xxxx-xxxx"/>
    </div>

    <button data-on-click="saveTracking()">حفظ الإعدادات</button>
    <div id="saveMsg" class="msg"></div>
  </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/api.js"></script>
<script>
registerActions({
  "saveTracking()": function(event){ saveTracking(); },
});
// API_URL / authToken / apiGet / apiPost / esc: من /static/js/core.js و api.js (Phase 4 / F4)

async function loadTracking(){
  var r = await apiGet("/tracking/getSettings");
  if(r.status==="ok"){
    var d = r.data||{};
    document.getElementById("t_meta").value = d.metaPixelId||"";
    document.getElementById("t_tiktok").value = d.tiktokPixelId||"";
    document.getElementById("t_gads").value = d.googleAdsId||"";
    document.getElementById("t_ga4").value = d.googleAnalyticsId||"";
    document.getElementById("t_snap").value = d.snapPixelId||"";
  }
}

async function saveTracking(){
  var data = {
    metaPixelId: document.getElementById("t_meta").value.trim(),
    tiktokPixelId: document.getElementById("t_tiktok").value.trim(),
    googleAdsId: document.getElementById("t_gads").value.trim(),
    googleAnalyticsId: document.getElementById("t_ga4").value.trim(),
    snapPixelId: document.getElementById("t_snap").value.trim(),
  };
  var r = await apiPost("/tracking/save", data);
  var msg = document.getElementById("saveMsg");
  if(r.status==="ok"){ msg.className="msg ok"; msg.textContent="✅ تم الحفظ بنجاح"; }
  else { msg.className="msg err"; msg.textContent="❌ "+r.message; }
}

loadTracking();
</script>
</body>
</html>
