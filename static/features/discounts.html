<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>أكواد الخصم — OrderFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/tokens.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);font-family:var(--font);padding:24px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:21px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;
  margin-bottom:20px;box-shadow:var(--shadow)}
.card h3{margin-bottom:16px;font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
input,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:9px 12px;font-size:13px;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;
  padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px -6px rgba(59,43,255,.35);
  transition:.15s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(59,43,255,.45)}
.btn-danger{background:var(--st-refused-bg);color:var(--st-refused-fg);border:1px solid var(--st-refused-bg);box-shadow:none}
.btn-danger:hover{background:#FFD3CC;transform:none;box-shadow:none}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th{text-align:right;color:var(--muted);font-size:11px;font-weight:700;padding:10px 8px;
  border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px}
td{padding:10px 8px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--card2)}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.b-on{background:var(--st-delivered-bg);color:var(--st-delivered-fg)}
.b-off{background:var(--st-refused-bg);color:var(--st-refused-fg)}
.msg{margin-top:12px;font-size:12px;display:none;font-weight:600}
.msg.ok{color:var(--green);display:block}
.msg.err{color:var(--red);display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏷️ أكواد الخصم والقسائم</h1>

  <div class="card">
    <h3>➕ إنشاء قسيمة جديدة</h3>
    <div class="row">
      <div><label>الكود (اتركه فارغ لتوليد تلقائي)</label><input id="c_code" placeholder="EX: SUMMER20"/></div>
      <div><label>النوع</label><select id="c_type"><option value="percent">نسبة %</option><option value="fixed">مبلغ ثابت</option></select></div>
      <div><label>القيمة</label><input id="c_value" type="number" value="10"/></div>
      <div><label>حد أدنى للطلب</label><input id="c_min" type="number" value="0"/></div>
      <div><label>عدد مرات الاستعمال (0=بلا حد)</label><input id="c_max" type="number" value="0"/></div>
      <div><label>تاريخ الانتهاء (اختياري)</label><input id="c_exp" type="date"/></div>
    </div>
    <button data-on-click="createCoupon()">إنشاء القسيمة</button>
    <div id="createMsg" class="msg"></div>
  </div>

  <div class="card">
    <h3>📋 القسائم الحالية</h3>
    <div id="couponsBox">⏳ جاري التحميل...</div>
  </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/api.js"></script>
<script>
registerActions({
  "createCoupon()": function(event){ createCoupon(); },
  "deleteCoupon(this.dataset.code)": function(event){ deleteCoupon(this.dataset.code); },
  "toggleCoupon(this.dataset.code,this.dataset.active==='true')": function(event){ toggleCoupon(this.dataset.code,this.dataset.active==='true'); },
});
// API_URL / authToken / apiGet / apiPost / esc: من /static/js/core.js و api.js (Phase 4 / F4)

async function loadCoupons(){
  var box = document.getElementById("couponsBox");
  var r = await apiGet("/coupons/list");
  if(r.status!=="ok"){ box.innerHTML = "❌ "+esc(r.message); return; }
  if(!r.data.length){ box.innerHTML = "لا توجد قسائم بعد"; return; }
  box.innerHTML = '<table><thead><tr><th>الكود</th><th>النوع</th><th>القيمة</th><th>الاستعمال</th><th>الحالة</th><th></th></tr></thead><tbody>'+
    r.data.map(function(c){
      var val = c.type==="percent" ? c.value+"%" : c.value+" دج";
      var used = c.maxUses ? (c.usedCount+" / "+c.maxUses) : (c.usedCount+" / ∞");
      return '<tr><td><strong>'+esc(c.code)+'</strong></td><td>'+(c.type==="percent"?"نسبة":"ثابت")+'</td>'+
        '<td>'+val+'</td><td>'+used+'</td>'+
        '<td><span class="badge '+(c.active?"b-on":"b-off")+'">'+(c.active?"فعّالة":"موقوفة")+'</span></td>'+
        '<td>'+
          '<button style="padding:5px 12px;font-size:11px" data-code="'+esc(c.code)+'" data-active="'+(!c.active)+'" data-on-click="toggleCoupon(this.dataset.code,this.dataset.active===\'true\')">'+(c.active?"إيقاف":"تفعيل")+'</button> '+
          '<button class="btn-danger" style="padding:5px 12px;font-size:11px" data-code="'+esc(c.code)+'" data-on-click="deleteCoupon(this.dataset.code)">حذف</button>'+
        '</td></tr>';
    }).join("")+'</tbody></table>';
}

async function createCoupon(){
  var data = {
    code: document.getElementById("c_code").value.trim(),
    type: document.getElementById("c_type").value,
    value: parseFloat(document.getElementById("c_value").value)||0,
    minOrderTotal: parseFloat(document.getElementById("c_min").value)||0,
    maxUses: parseInt(document.getElementById("c_max").value)||0,
    expiresAt: document.getElementById("c_exp").value,
    active: true,
  };
  var r = await apiPost("/coupons/create", data);
  var msg = document.getElementById("createMsg");
  if(r.status==="ok"){
    msg.className="msg ok"; msg.textContent="✅ تم إنشاء القسيمة: "+r.data.code;
    loadCoupons();
  } else { msg.className="msg err"; msg.textContent="❌ "+r.message; }
}

async function toggleCoupon(code, active){
  await apiPost("/coupons/update", {code:code, active:active});
  loadCoupons();
}
async function deleteCoupon(code){
  if(!confirm("حذف "+code+" نهائياً؟")) return;
  await apiPost("/coupons/delete", {code:code});
  loadCoupons();
}

loadCoupons();
</script>
</body>
</html>
