<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ربط شركات الشحن — OrderFlow</title>
<style>
:root{--bg:#0d1b2e;--card:#111f35;--card2:#0f1c30;--accent:#2563eb;--green:#10b981;--red:#ef4444;
--text:#e8edf5;--muted:#8899bb;--border:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;padding:20px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px}
.field{margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
border-radius:8px;padding:9px 12px;font-size:13px}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 22px;
font-size:13px;font-weight:700;cursor:pointer}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);margin-right:8px}
.msg{margin-top:12px;font-size:12px;display:none}
.msg.ok{color:var(--green);display:block}
.msg.err{color:var(--red);display:block}
.status-box{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚚 ربط شركات الشحن</h1>

  <div id="connectedBox" style="display:none" class="status-box">
    <div style="color:var(--green);font-weight:700">✅ متصل بـ Yalidine</div>
    <div id="connectedSince" style="font-size:12px;color:var(--muted);margin-top:4px"></div>
    <button class="btn-danger" style="margin-top:10px" onclick="disconnect()">فك الربط</button>
  </div>

  <div id="formCard" class="card">
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px">
      احصلي على API ID و API Token من لوحة تحكم Yalidine (Développement → Tableau de bord).
    </p>
    <div class="field"><label>API ID</label><input id="sh_apiId"/></div>
    <div class="field"><label>API Token</label><input id="sh_apiToken" type="password"/></div>
    <button onclick="connectShipping()">ربط الحساب</button>
    <div id="connectMsg" class="msg"></div>
  </div>
</div>

<script>
var API_URL = "https://orderconfidence.com/api";
var authToken = localStorage.getItem("of_token");

async function apiGet(path){
  var r = await fetch(API_URL+path, {headers:{"Authorization":"Bearer "+authToken}});
  return r.json();
}
async function apiPost(path, body){
  var r = await fetch(API_URL+path, {method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+authToken},
    body:JSON.stringify(body)});
  return r.json();
}

async function loadStatus(){
  var r = await apiGet("/shipping/status");
  if(r.status==="ok" && r.data.connected){
    document.getElementById("connectedBox").style.display = "block";
    document.getElementById("formCard").style.display = "none";
    document.getElementById("connectedSince").textContent = "منذ: "+r.data.connectedAt;
  }
}

async function connectShipping(){
  var apiId = document.getElementById("sh_apiId").value.trim();
  var apiToken = document.getElementById("sh_apiToken").value.trim();
  var msg = document.getElementById("connectMsg");
  if(!apiId||!apiToken){ msg.className="msg err"; msg.textContent="عبّي كل الحقول"; return; }
  msg.className="msg"; msg.style.display="none";
  var r = await apiPost("/shipping/connect", {provider:"yalidine", apiId:apiId, apiToken:apiToken});
  if(r.status==="ok"){ msg.className="msg ok"; msg.textContent="✅ تم الربط بنجاح"; loadStatus(); }
  else { msg.className="msg err"; msg.textContent="❌ "+r.message; }
}

async function disconnect(){
  if(!confirm("فك ربط Yalidine؟")) return;
  await apiPost("/shipping/disconnect", {});
  location.reload();
}

loadStatus();
</script>
</body>
</html>
